# PYTHON VERSION
target-version = "py314"

# MAIN SETTINGS
line-length = 88
indent-width = 4

# `ruff check` сразу применяет безопасные автофиксы (как с флагом --fix)
fix = true

# Дополняет дефолтные исключения Ruff (.venv, .git и т.д.)
extend-exclude = [
    "migrations",
    "manage.py",
]

# LINT
[lint]
preview = true
select = [
    "UP",   # pyupgrade
    "I",    # isort
    "E",    # flake8-errors
    "W",    # flake8-warnings
    "F",    # flake8-pyflakes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "T20",  # flake8-print
    "T10",  # flake8-debugger
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff
    "DTZ",  # flake8-datetimez
    "DJ",   # flake8-django
    "FURB", # refurb
]

ignore = [
    "C408",   # Ненужный вызов dict, list и т.д.
    "RUF001", # Игнорирование похожих символов с разными ASCII
    "RUF002", # Игнорирование похожих символов с разными ASCII
    "RUF003", # Игнорирование похожих символов с разными ASCII
    "S110",   # try-except-pass
    "RUF012", # Mutable class attributes: ложные срабатывания на Django Meta/list_display
]

[lint.per-file-ignores]
# Тесты: assert (S101) и "пароли" в фикстурах (S106) — норма
"**/tests.py" = ["S101", "S106"]
"**/tests/**" = ["S101", "S106"]
# Settings: плейсхолдеры секретов (S105) и star-импорты локальных настроек
"**/settings.py" = ["S105", "F403", "F405", "E501"]

[lint.isort]
# Свои приложения — first-party, чтобы isort не мешал их с django/drf
known-first-party = [
    "core",
    "users",
    "companies",
    "finance",
    "pricing",
    "school_settings",
    "lessons",
]

[lint.flake8-bandit]
check-typed-exception = true

[format]
quote-style = "double" # 'single' для одинарных, "double" для двойных кавычек
indent-style = "space"
