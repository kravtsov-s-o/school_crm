[project]
name = "school-crm"
version = "0.1.0"
description = ""
authors = [
    {name = "s.kravtsov",email = "s.kravtsov@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "django-timezone-field (>=7.2.2,<8.0.0)",
    "django-phonenumber-field[phonenumbers] (>=8.4.0,<9.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-json-logger (>=4.2.0,<5.0.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "markdown (>=3.10.3,<4.0.0)",
    "django-filter (>=26.1,<27.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-storages[s3] (>=1.14.6,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.21,<0.16.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]